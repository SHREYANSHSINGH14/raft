services:
  peer1:
    build:
      context: ..
      dockerfile: example/Dockerfile
    ports:
      - "50051:50051"
      - "8081:8080"
    environment:
      - ID=peer1
      - BASE_URL=0.0.0.0
      - PORT=50051
      - DEBUG_PORT=8080
      - DB_DIR=data
      - LOG_LEVEL=debug
      - PEER_INFO=peers.yaml
      - RPC_TIMEOUT_MS=50
      - HEARTBEAT_MS=100
      - ELECTION_MIN_MS=1000
      - ELECTION_MAX_MS=5000
      # Deliberately low. At the defaults (1000 entries / 300s) a cluster you are
      # poking at by hand never snapshots, so compaction and InstallSnapshot never
      # run and neither gets exercised.
      - SNAPSHOT_DIR=snapshots
      - SNAPSHOT_INTERVAL_S=30
      - SNAPSHOT_THRESHOLD=10
      # InstallSnapshot deadline: a fixed base for the receiver's fsyncs,
      # rename and Restore, plus 1s per MB transferred. Deliberately not
      # derived from RPC_TIMEOUT_MS — that one is capped below HEARTBEAT_MS.
      - INSTALL_SNAPSHOT_BASE_MS=5000
      - INSTALL_SNAPSHOT_DEADLINE_SCALE_SIZE_BYTE=1048576
      - INSTALL_SNAPSHOT_DEADLINE_SCALE_TIME_MS=1000
    volumes:
      - ./peers.yaml:/app/peers.yaml  # all peers share same yaml
      - peer1_data:/app/data
      - peer1_snapshots:/app/snapshots

