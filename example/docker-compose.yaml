  # peer6 and peer7 are NOT part of the initial configuration and are absent from
  # peers.yaml. They start, idle, and wait to be joined at runtime:
  #
  #   curl -s -X POST http://localhost:8084/cluster/add \
  #     -d '{"id":"peer6","rpc_url":"peer6:50056","peer_state":"VOTER"}'
  #
  # PEER_INFO is unset for them, which LoadConfig treats as "no peers" — they learn
  # the configuration from the leader's AppendEntries once the addition commits.
  peer6:
    build:
      context: ..
      dockerfile: example/Dockerfile
    ports:
      - "50056:50056"
      - "8086:8080"
    environment:
